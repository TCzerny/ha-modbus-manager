# inepro PRO380-Mod
#
# Addresses are the hexadecimal protocol addresses from the inepro V1.18 map,
# converted to decimal without an offset. Measurements are Float ABCD
# (IEEE-754 binary32, big-endian bytes and words) read through FC03.
name: "inepro PRO380-Mod"
display_name: "inepro PRO380-Mod"
description: "Read-only three-phase electricity meter (Modbus RTU)."
manufacturer: "inepro"
model: "PRO380-Mod"
type: "electricity_meter"
version: 1.0.0
default_prefix: "inepro_pro380"
default_slave_id: 1

sensors:
  - {name: "L1 Voltage", unique_id: "l1_voltage", translation_key: "inepro_pro380_l1_voltage", address: 20482, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: none, unit_of_measurement: "V", device_class: voltage, state_class: measurement, precision: 1, scan_interval: 15, mm_group: "electrical"}
