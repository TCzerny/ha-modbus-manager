  - {name: "Total Home Consumption from PV", unique_id: "total_home_consumption_pv", address: 114, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scan_group: slow}
  - {name: "Home Consumption from PV", unique_id: "home_consumption_pv", address: 116, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "Total Home Consumption", unique_id: "total_home_consumption", address: 118, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scan_group: slow}
  - {name: "Isolation Resistance", unique_id: "isolation_resistance", address: 120, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "Ω", state_class: measurement, precision: 0, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Power Limit from EVU", unique_id: "power_limit_evu", address: 122, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "%", state_class: measurement, precision: 0, scan_group: medium, entity_category: diagnostic}
