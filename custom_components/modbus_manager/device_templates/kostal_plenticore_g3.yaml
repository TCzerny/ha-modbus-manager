  - {name: "Phase 1 Active Power", unique_id: "phase1_active_power", address: 156, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium}
  - {name: "Phase 1 Voltage", unique_id: "phase1_voltage", address: 158, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "V", device_class: voltage, state_class: measurement, precision: 1, scan_group: medium}
