# KOSTAL PLENTICORE G3 (read-only)
#
# Source: KOSTAL "Interface description MODBUS (TCP) & SunSpec with control information",
# revision 2.9 (17.07.2026), sections 3.2-3.5. Addresses are the decimal protocol
# addresses from the spec, no offset.
#
# Verified by reading (FC03 only) on a PLENTICORE G3 M, UI/FW 3.07.03.27599,
# BYD Battery-Box Premium HVS, KSEM, 08.11.2026. Not verified: G3 L/S, MP G3, BI,
# PLENTICORE plus G2, PIKO, inverters without battery.
#
# IMPORTANT NOTES:
# - Modbus TCP port 1502, unit ID 71 (inverter defaults). Modbus must be enabled in
#   the web UI (Settings > Modbus/SunSpec (TCP)).
# - Assumes the default byte order "little-endian (CDAB)" (register 5 = 0).
#   Float32 and the U32 values at 0x24/0x38/0x68 are word-swapped (CDAB).
#   U32 values from 0x200 on (512, 527, 529, 577, 586, 1288, 40346, 40354) are read
#   high word first on the tested unit, despite the CDAB setting.
# - Strings are big-endian bytes, padded with NUL (battery manufacturer with spaces).
# - Reads must start at a documented address. Reads that start inside a field or
#   span the undocumented ranges 71-97, 300-319 and 592-607 return exception 2.
#   The register optimizer only merges strictly adjacent registers, so this template
#   never requests those gaps.
# - Register 588 (battery type) became U32 in G3 FW 3.07.03.27419 (M-TEC = 0x10000);
#   read as U16 here, which Kostal keeps for backwards compatibility.
# - Read-only on purpose. External battery management (1024-1044) falls back to
#   internal control after the timeout set in the web UI unless it is written
#   cyclically; a write-once number control would silently revert.
# - This is a BETA template - use at your own risk.

name: "KOSTAL PLENTICORE G3"
display_name: "KOSTAL PLENTICORE G3 (read-only)"
description: "Read-only template for KOSTAL PLENTICORE G3 hybrid inverters: PV, AC, battery, power meter and energy counters."
manufacturer: "KOSTAL"
model: "PLENTICORE G3"
type: "PV_Hybrid_Inverter"
version: 0.1.0
default_prefix: "kostal"
default_slave_id: 71

sensors:

  # Device information (spec 3.2, 0x02-0x3A). Strings: big-endian bytes, NUL padded.
  - {name: "Modbus Byte Order", unique_id: "modbus_byte_order", address: 5, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, map: {0: "Little-endian (CDAB)", 1: "Big-endian (ABCD)"}}
  - {name: "Modbus Unit ID", unique_id: "modbus_unit_id", address: 4, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Article Number", unique_id: "article_number", address: 6, input_type: holding, read_function_code: 3, data_type: string, count: 8, encoding: latin1, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Serial Number", unique_id: "serial_number", address: 14, input_type: holding, read_function_code: 3, data_type: string, count: 8, encoding: latin1, scan_group: slow, entity_category: diagnostic}
  - {name: "Bidirectional Converters", unique_id: "bidirectional_converters", address: 30, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "AC Phases", unique_id: "ac_phases", address: 32, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "PV Strings", unique_id: "pv_strings", address: 34, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Hardware Version", unique_id: "hardware_version", address: 36, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: word, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Software Version MC", unique_id: "software_version_mc", address: 38, input_type: holding, read_function_code: 3, data_type: string, count: 8, encoding: latin1, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Software Version IOC", unique_id: "software_version_ioc", address: 46, input_type: holding, read_function_code: 3, data_type: string, count: 8, encoding: latin1, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Software Version", unique_id: "inverter_firmware_info", address: 58, input_type: holding, read_function_code: 3, data_type: string, count: 13, encoding: latin1, scan_group: slow, entity_category: diagnostic}
  - {name: "Inverter State", unique_id: "inverter_state", address: 56, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: word, scan_group: fast, icon: "mdi:solar-power-variant", map: {0: "Off", 1: "Init", 2: "IsoMeas", 3: "GridCheck", 4: "StartUp", 6: "FeedIn", 7: "Throttled", 8: "ExtSwitchOff", 9: "Update", 10: "Standby", 11: "GridSync", 12: "GridPreCheck", 13: "GridSwitchOff", 14: "Overheating", 15: "Shutdown", 16: "ImproperDcVoltage", 17: "ESB", 18: "Unknown"}}

