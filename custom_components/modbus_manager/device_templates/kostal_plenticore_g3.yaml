  - {name: "Total DC Power", unique_id: "total_dc_power", address: 100, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "Energy Manager State", unique_id: "energy_manager_state", address: 104, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: word, scan_group: medium, entity_category: diagnostic, map: {0: "Idle", 2: "Emergency Battery Charge", 8: "Winter Mode Step 1", 16: "Winter Mode Step 2"}}
  - {name: "Home Consumption from Battery", unique_id: "home_consumption_battery", address: 106, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "Home Consumption from Grid", unique_id: "home_consumption_grid", address: 108, input_type: holding, read_function_code: 3, data_type: float32, count: 2, byte_order: big, swap: word, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
