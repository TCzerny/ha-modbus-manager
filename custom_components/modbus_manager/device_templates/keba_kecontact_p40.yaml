    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    read_group: "keba_1010"
    scan_group: fast
    mm_group: "EV_measurements"

  - name: "Current L3"
    unique_id: "current_l3"
    translation_key: "keba_current_l3"
    address: 1012
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    read_group: "keba_1012"
    scan_group: fast
    mm_group: "EV_measurements"

  - name: "Serial Number"
    unique_id: "serial_number"
    translation_key: "keba_serial_number"
    address: 1014
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
