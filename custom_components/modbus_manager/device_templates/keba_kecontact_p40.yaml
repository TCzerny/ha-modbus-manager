    unique_id: "active_power"
    translation_key: "keba_active_power"
    address: 1020
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
    unit_of_measurement: "W"
