    count: 2
    byte_order: big
    swap: none
    precision: 0
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    read_group: "keba_1040"
    scan_group: fast
    mm_group: "EV_measurements"

  - name: "Voltage L2"
    unique_id: "voltage_l2"
    translation_key: "keba_voltage_l2"
    address: 1042
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    read_group: "keba_1042"
    scan_group: fast
    mm_group: "EV_measurements"

  - name: "Voltage L3"
    unique_id: "voltage_l3"
    translation_key: "keba_voltage_l3"
    address: 1044
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    read_group: "keba_1044"
    scan_group: fast
    mm_group: "EV_measurements"

  - name: "Power Factor"
    unique_id: "power_factor"
    translation_key: "keba_power_factor"
