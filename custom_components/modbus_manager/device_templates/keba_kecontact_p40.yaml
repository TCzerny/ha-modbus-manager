    mm_group: "EV_device_info"
    entity_category: diagnostic

  - name: "Hardware Revision KC-MS10"
    unique_id: "hardware_revision_ms10"
    translation_key: "keba_hardware_revision_ms10"
    address: 1702
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    read_group: "keba_1702"
    scan_group: slow
    mm_group: "EV_device_info"
    entity_category: diagnostic

controls: []

calculated:
  - name: "Charging State"
    unique_id: "charging_state"
    translation_key: "keba_charging_state"
    type: sensor
    mm_group: "EV_charging_status"
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_charging_state_raw]]') in ['0', '1', '2', '3', '4', '5'] }}
    state: >-
      {{ {0: 'Starting', 1: 'Not ready', 2: 'Ready', 3: 'Charging', 4: 'Error', 5: 'Suspended'}
         [states('[[mm:sensor:{PREFIX}_charging_state_raw]]') | int] }}

  - name: "Cable State"
    unique_id: "cable_state"
    translation_key: "keba_cable_state"
    type: sensor
    mm_group: "EV_charging_status"
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_cable_state_raw]]') in ['0', '1', '3', '5', '7'] and
         states('[[mm:sensor:{PREFIX}_product_type_and_features]]') | is_number }}
    state: >-
      {% set product = states('[[mm:sensor:{PREFIX}_product_type_and_features]]') | int %}
      {% set attached = (product // 10000) % 10 == 1 %}
      {% set code = states('[[mm:sensor:{PREFIX}_cable_state_raw]]') | int %}
      {% if attached and code in [3, 7] %}
        {{ 'Vehicle connected' if code == 7 else 'Station connected' }}
      {% else %}
        {{ {0: 'Disconnected', 1: 'Station connected', 3: 'Station connected and locked',
            5: 'Vehicle connected, unlocked', 7: 'Vehicle connected and locked'}[code] }}
      {% endif %}

  - name: "Firmware Version"
    unique_id: "firmware_version"
    translation_key: "keba_firmware_version"
    type: sensor
    mm_group: "EV_device_info"
    entity_category: diagnostic
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_firmware_version_raw]]') | is_number and
         (states('[[mm:sensor:{PREFIX}_firmware_version_raw]]') | int) > 0 }}
    state: >-
      {%- set version = states('[[mm:sensor:{PREFIX}_firmware_version_raw]]') | int -%}
      {{ '%d.%d.%d' | format(version // 10000, (version // 100) % 100, version % 100) }}

  - name: "RFID UID Prefix"
    unique_id: "rfid_uid_prefix"
    translation_key: "keba_rfid_uid_prefix"
    type: sensor
    mm_group: "EV_device_info"
    entity_category: diagnostic
    condition: "rfid == 'enabled'"
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_rfid_card_raw]]') | is_number and
         0 < (states('[[mm:sensor:{PREFIX}_rfid_card_raw]]') | int) <= 4294967295 }}
    state: >-
      {{ '%08X' | format(states('[[mm:sensor:{PREFIX}_rfid_card_raw]]') | int) }}

binary_sensors:
  - name: "Vehicle Connected"
    unique_id: "vehicle_connected"
    translation_key: "keba_vehicle_connected"
    type: binary_sensor
    device_class: plug
    mm_group: "EV_charging_status"
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_cable_state_raw]]') in ['0', '1', '3', '5', '7'] }}
    state: >-
      {{ states('[[mm:sensor:{PREFIX}_cable_state_raw]]') in ['5', '7'] }}

  - name: "Charging Active"
    unique_id: "charging_active"
    translation_key: "keba_charging_active"
    type: binary_sensor
    device_class: running
    mm_group: "EV_charging_status"
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_charging_state_raw]]') in ['0', '1', '2', '3', '4', '5'] }}
    state: >-
      {{ states('[[mm:sensor:{PREFIX}_charging_state_raw]]') == '3' }}

  - name: "Error Present"
    unique_id: "error_present"
    translation_key: "keba_error_present"
    type: binary_sensor
    device_class: problem
    mm_group: "EV_device_status"
    entity_category: diagnostic
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_charging_state_raw]]') in ['0', '1', '2', '3', '4', '5'] }}
    state: >-
      {{ states('[[mm:sensor:{PREFIX}_charging_state_raw]]') == '4' }}

  - name: "Plug Locked"
    unique_id: "plug_locked"
    translation_key: "keba_plug_locked"
    type: binary_sensor
    icon: "mdi:lock"
    mm_group: "EV_charging_status"
    condition: "connector_type == 'socket'"
    availability: >-
      {{ states('[[mm:sensor:{PREFIX}_cable_state_raw]]') in ['0', '1', '3', '5', '7'] }}
    state: >-
      {{ states('[[mm:sensor:{PREFIX}_cable_state_raw]]') in ['3', '7'] }}
