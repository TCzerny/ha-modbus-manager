  - name: "Maximum Charging Current"
    unique_id: "maximum_charging_current"
    translation_key: "keba_maximum_charging_current"
    address: 1100
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    read_group: "keba_1100"
    scan_group: fast
    mm_group: "EV_charging_status"

  - name: "Supported Charging Current"
    unique_id: "supported_charging_current"
    translation_key: "keba_supported_charging_current"
    address: 1110
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    read_group: "keba_1110"
    scan_group: fast
    mm_group: "EV_charging_status"

  - name: "Fast Charging Status"
    unique_id: "fast_charging_status"
    translation_key: "keba_fast_charging_status"
