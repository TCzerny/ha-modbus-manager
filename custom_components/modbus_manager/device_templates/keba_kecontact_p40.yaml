    count: 2
    byte_order: big
    swap: none
    read_group: "keba_1552"
    scan_group: medium
    mm_group: "EV_charging_status"
    condition: "phase_switching_registers == 'confirmed'"
    map:
      1: "Single-phase charging"
      3: "Three-phase charging possible"

  - name: "Failsafe Current Setting"
    unique_id: "failsafe_current_setting"
    translation_key: "keba_failsafe_current_setting"
    address: 1600
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
