    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    read_group: "keba_1016"
    scan_group: slow
    mm_group: "EV_device_info"
    entity_category: diagnostic

  - name: "Firmware Version (raw)"
    unique_id: "firmware_version_raw"
    translation_key: "keba_firmware_version_raw"
    address: 1018
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
