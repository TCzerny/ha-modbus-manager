    translation_key: "keba_error_code"
    address: 1006
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    read_group: "keba_1006"
    scan_group: fast
    mm_group: "EV_device_status"
    entity_category: diagnostic

  - name: "Current L1"
    unique_id: "current_l1"
    translation_key: "keba_current_l1"
    address: 1008
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    scale: 0.001
    precision: 3
    unit_of_measurement: "A"
    device_class: current
