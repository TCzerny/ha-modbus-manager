# KEBA KeContact P40/P40 Pro Modbus TCP Programmers Guide V1.02 (04.2025).
# See docs/README_keba_kecontact.md, particularly the pre-1.2.1 energy bug.
# Each documented value requires its own FC03 request of exactly two words.
name: "KEBA KeContact P40"
display_name: "KEBA KeContact P40 / P40 Pro"
description: "Read-only KeContact P40/P40 Pro monitoring with firmware-dependent energy scaling."
manufacturer: "KEBA"
model: "KeContact P40 / P40 Pro"
type: "ev_charger"
version: 1.0.0
firmware_version: "1.2.1"
default_prefix: "keba_p40"
default_slave_id: 255
config_flow_note: "TCP port 502, Unit ID 255; enable Modbus in the KEBA app. Set message wait to at least 500 ms. Select the correct energy firmware profile before recording statistics. Phase registers require confirmed hardware/firmware support."

dynamic_config:
  valid_models:
    "KeContact P40": {}
    "KeContact P40 Pro": {}

  firmware_version:
    description: "Energy encoding profile, not automatic firmware detection"
    options:
      "1.0.0": "Installed firmware below 1.2.1 (Wh)"
      "1.2.1": "Installed firmware 1.2.1 or newer (0.1 Wh)"
    default: "1.2.1"
    sensor_replacements:
      total_energy:
        "1.0.0": {scale: 0.001, precision: 3}
        "1.2.1": {scale: 0.0001, precision: 4}
      session_energy:
        "1.0.0": {scale: 0.001, precision: 3}
        "1.2.1": {scale: 0.0001, precision: 4}

  connector_type:
    description: "Connector hardware (locking status applies to sockets only)"
    options:
      cable: "Attached cable"
      socket: "Socket"
    default: cable

  rfid:
    description: "RFID hardware installed and Modbus RFID reading enabled in KEBA app"
    options:
      unavailable: "Do not read RFID information"
      enabled: "Read RFID information (sensitive data)"
    default: unavailable

  phase_switching_registers:
    description: "Registers 1550/1552 verified on installed phase-switching hardware and firmware"
    options:
      unavailable: "Not confirmed (do not read)"
      confirmed: "Confirmed supported by this device"
    default: unavailable

sensors:
  - name: "Charging State (raw)"
    unique_id: "charging_state_raw"
    translation_key: "keba_charging_state_raw"
    address: 1000
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    read_group: "keba_1000"
    scan_group: fast
    mm_group: "EV_charging_status"
    entity_category: diagnostic

  - name: "Cable State (raw)"
    unique_id: "cable_state_raw"
    translation_key: "keba_cable_state_raw"
    address: 1004
    input_type: holding
    read_function_code: 3
    data_type: uint32
    count: 2
    byte_order: big
    swap: none
    precision: 0
    read_group: "keba_1004"
    scan_group: fast
    mm_group: "EV_charging_status"
    entity_category: diagnostic

  - name: "Error Code"
