# KOSTAL Smart Energy Meter (KSEM G1/G2), read-only
#
# Source: KOSTAL "KSEM G1/G2 Interface Beschreibung MODBUS" (13.03.2025, SW 2.6.0),
# sections 3.2-3.6. Addresses are the decimal protocol addresses, no offset.
#
# Verified by reading (FC03 only) on a KOSTAL Smart Energy Meter G2 (HWv3),
# firmware 2.7.2, Modbus TCP port 502, unit ID 1, 08.11.2026. KSEM G1 not verified.
#
# IMPORTANT NOTES:
# - Modbus TCP slave must be enabled in the KSEM web UI (port 502; 802 with TLS).
# - All multi-register values are big-endian, most significant word first (no swap).
# - Internal registers use fixed scaling (0.1 W, 0.001 A/V/Hz, 0.1 Wh) and split import
#   (+) and export (-) into separate unsigned values. The SunSpec meter model (40000+)
#   uses dynamic scale factors and is not used here.
# - Energy counters are uint64 (0.1 Wh); only the lower 32 bits are read (address + 2),
#   which is exact up to 429.4 MWh per counter.
# - Reads of unspecified registers return exception 2; reads across gaps between
#   specified registers and reads starting inside a field were accepted on the tested unit.
# - The energy flow block (40960+) reflects the KOSTAL system as the KSEM sees it
#   (inverter, battery, wallbox); other generators are not included in it.
# - This is a BETA template - use at your own risk.

name: "KOSTAL Smart Energy Meter"
display_name: "KOSTAL Smart Energy Meter (KSEM, read-only)"
description: "Read-only template for the KOSTAL Smart Energy Meter G1/G2: grid power, per-phase values, energy counters and the KOSTAL energy flow block."
manufacturer: "KOSTAL"
model: "Smart Energy Meter"
type: "energy_meter"
version: 0.1.0
default_prefix: "ksem"
default_slave_id: 1

sensors:

  # Device information (KSEM/RM PnP registers 0x2000-0x2039, SunSpec common model)
  - {name: "Product", unique_id: "product_id", address: 8193, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, map: {18498: "KSEM G1 (HWv1)", 18514: "KSEM G2 (HWv2)", 18530: "KSEM G2 (HWv3)"}}
  - {name: "Vendor Name", unique_id: "vendor_name", address: 8196, input_type: holding, read_function_code: 3, data_type: string, count: 16, encoding: latin1, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Product Name", unique_id: "product_name", address: 8212, input_type: holding, read_function_code: 3, data_type: string, count: 16, encoding: latin1, scan_group: slow, entity_category: diagnostic}
  - {name: "Serial Number", unique_id: "serial_number", address: 8228, input_type: holding, read_function_code: 3, data_type: string, count: 16, encoding: latin1, scan_group: slow, entity_category: diagnostic}
  - {name: "Measuring Interval", unique_id: "measuring_interval", address: 8244, input_type: holding, read_function_code: 3, data_type: uint16, unit_of_measurement: "ms", precision: 0, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Firmware Version", unique_id: "meter_firmware_info", address: 40044, input_type: holding, read_function_code: 3, data_type: string, count: 8, encoding: latin1, scan_group: slow, entity_category: diagnostic}

  # Instantaneous values, sum of all phases (0x0000-0x001B). + = import, - = export
  - {name: "Active Power Import", unique_id: "active_power_import", address: 0, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: fast}
  - {name: "Active Power Export", unique_id: "active_power_export", address: 2, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: fast}
  - {name: "Reactive Power Import", unique_id: "reactive_power_import", address: 4, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "Reactive Power Export", unique_id: "reactive_power_export", address: 6, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "Apparent Power Import", unique_id: "apparent_power_import", address: 16, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "Apparent Power Export", unique_id: "apparent_power_export", address: 18, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "Power Factor", unique_id: "power_factor", address: 24, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, device_class: power_factor, state_class: measurement, precision: 3, scale: 0.001, scan_group: medium, enabled_by_default: false}
  - {name: "Grid Frequency", unique_id: "grid_frequency", address: 26, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Hz", device_class: frequency, state_class: measurement, precision: 2, scale: 0.001, scan_group: medium}

  # Phase L1 (0x0028-0x0041)
  - {name: "L1 Active Power Import", unique_id: "l1_active_power_import", address: 40, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium}
  - {name: "L1 Active Power Export", unique_id: "l1_active_power_export", address: 42, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium}
  - {name: "L1 Reactive Power Import", unique_id: "l1_reactive_power_import", address: 44, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L1 Reactive Power Export", unique_id: "l1_reactive_power_export", address: 46, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L1 Apparent Power Import", unique_id: "l1_apparent_power_import", address: 56, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L1 Apparent Power Export", unique_id: "l1_apparent_power_export", address: 58, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L1 Current", unique_id: "l1_current", address: 60, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "A", device_class: current, state_class: measurement, precision: 2, scale: 0.001, scan_group: medium}
  - {name: "L1 Voltage", unique_id: "l1_voltage", address: 62, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "V", device_class: voltage, state_class: measurement, precision: 1, scale: 0.001, scan_group: medium}
  - {name: "L1 Power Factor", unique_id: "l1_power_factor", address: 64, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, device_class: power_factor, state_class: measurement, precision: 3, scale: 0.001, scan_group: medium, enabled_by_default: false}

  # Phase L2 (0x0050-0x0069)
  - {name: "L2 Active Power Import", unique_id: "l2_active_power_import", address: 80, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium}
  - {name: "L2 Active Power Export", unique_id: "l2_active_power_export", address: 82, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium}
  - {name: "L2 Reactive Power Import", unique_id: "l2_reactive_power_import", address: 84, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L2 Reactive Power Export", unique_id: "l2_reactive_power_export", address: 86, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L2 Apparent Power Import", unique_id: "l2_apparent_power_import", address: 96, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L2 Apparent Power Export", unique_id: "l2_apparent_power_export", address: 98, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L2 Current", unique_id: "l2_current", address: 100, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "A", device_class: current, state_class: measurement, precision: 2, scale: 0.001, scan_group: medium}
  - {name: "L2 Voltage", unique_id: "l2_voltage", address: 102, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "V", device_class: voltage, state_class: measurement, precision: 1, scale: 0.001, scan_group: medium}
  - {name: "L2 Power Factor", unique_id: "l2_power_factor", address: 104, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, device_class: power_factor, state_class: measurement, precision: 3, scale: 0.001, scan_group: medium, enabled_by_default: false}

  # Phase L3 (0x0078-0x0091)
  - {name: "L3 Active Power Import", unique_id: "l3_active_power_import", address: 120, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium}
  - {name: "L3 Active Power Export", unique_id: "l3_active_power_export", address: 122, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium}
  - {name: "L3 Reactive Power Import", unique_id: "l3_reactive_power_import", address: 124, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L3 Reactive Power Export", unique_id: "l3_reactive_power_export", address: 126, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "var", device_class: reactive_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L3 Apparent Power Import", unique_id: "l3_apparent_power_import", address: 136, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L3 Apparent Power Export", unique_id: "l3_apparent_power_export", address: 138, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VA", device_class: apparent_power, state_class: measurement, precision: 0, scale: 0.1, scan_group: medium, enabled_by_default: false}
  - {name: "L3 Current", unique_id: "l3_current", address: 140, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "A", device_class: current, state_class: measurement, precision: 2, scale: 0.001, scan_group: medium}
  - {name: "L3 Voltage", unique_id: "l3_voltage", address: 142, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "V", device_class: voltage, state_class: measurement, precision: 1, scale: 0.001, scan_group: medium}
  - {name: "L3 Power Factor", unique_id: "l3_power_factor", address: 144, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, device_class: power_factor, state_class: measurement, precision: 3, scale: 0.001, scan_group: medium, enabled_by_default: false}

  # Energy counters (0x0200-0x0317) are uint64 in 0.1 Wh. Modbus Manager has no uint64,
  # so the template reads the lower 32 bits (address + 2), valid up to 429.4 MWh per counter.
  - {name: "Active Energy Import", unique_id: "active_energy_import", address: 514, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow}
  - {name: "Active Energy Export", unique_id: "active_energy_export", address: 518, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow}
  - {name: "Reactive Energy Import", unique_id: "reactive_energy_import", address: 522, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "varh", state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "Reactive Energy Export", unique_id: "reactive_energy_export", address: 526, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "varh", state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "Apparent Energy Import", unique_id: "apparent_energy_import", address: 546, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VAh", state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "Apparent Energy Export", unique_id: "apparent_energy_export", address: 550, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "VAh", state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "L1 Active Energy Import", unique_id: "l1_active_energy_import", address: 594, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "L1 Active Energy Export", unique_id: "l1_active_energy_export", address: 598, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "L2 Active Energy Import", unique_id: "l2_active_energy_import", address: 674, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "L2 Active Energy Export", unique_id: "l2_active_energy_export", address: 678, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "L3 Active Energy Import", unique_id: "l3_active_energy_import", address: 754, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}
  - {name: "L3 Active Energy Export", unique_id: "l3_active_energy_export", address: 758, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "Wh", device_class: energy, state_class: total_increasing, precision: 0, scale: 0.1, scan_group: slow, enabled_by_default: false}

  # Energy flow / dashboard block (static Modbus 0xA000, KSEM SW >= 2.6.0). Values as the
  # KSEM sees the KOSTAL system: battery (-) = charging, grid (+) = import.
  - {name: "Energy Flow Block Type", unique_id: "energy_flow_block_type", address: 40960, input_type: holding, read_function_code: 3, data_type: string, count: 4, encoding: latin1, scan_group: slow, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Grid Power", unique_id: "grid_power", address: 40972, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "Inverter AC Power", unique_id: "inverter_ac_power", address: 40974, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "PV DC Power", unique_id: "pv_dc_power", address: 40976, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "Home Consumption", unique_id: "home_consumption", address: 40982, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "Battery Power", unique_id: "battery_power", address: 40984, input_type: holding, read_function_code: 3, data_type: int32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: fast}
  - {name: "System SoC", unique_id: "system_soc", address: 40986, input_type: holding, read_function_code: 3, data_type: uint16, unit_of_measurement: "%", device_class: battery, state_class: measurement, precision: 0, scan_group: medium}
  - {name: "Home Consumption from PV", unique_id: "home_consumption_pv", address: 40988, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium}
  - {name: "Home Consumption from Battery", unique_id: "home_consumption_battery", address: 40990, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium}
  - {name: "Home Consumption from Grid", unique_id: "home_consumption_grid", address: 40992, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium}
  - {name: "Wallbox Charge Mode", unique_id: "wallbox_charge_mode", address: 40994, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, enabled_by_default: false, map: {0: "No comfort function", 1: "Lock", 2: "Power", 3: "Solar Pure", 4: "Solar Plus"}}
  - {name: "Wallbox Charge Power", unique_id: "wallbox_charge_power", address: 40996, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium, enabled_by_default: false}
  - {name: "Wallbox Charge Power from PV", unique_id: "wallbox_charge_power_pv", address: 40998, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium, enabled_by_default: false}
  - {name: "Wallbox Charge Power from Battery", unique_id: "wallbox_charge_power_battery", address: 41000, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium, enabled_by_default: false}
  - {name: "Wallbox Charge Power from Grid", unique_id: "wallbox_charge_power_grid", address: 41002, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium, enabled_by_default: false}
  - {name: "Inverter Control Values", unique_id: "inverter_control_values", address: 41010, input_type: holding, read_function_code: 3, data_type: uint32, count: 2, byte_order: big, swap: none, unit_of_measurement: "W", device_class: power, state_class: measurement, precision: 0, scan_group: medium, entity_category: diagnostic, enabled_by_default: false}
  - {name: "Curtailment Active", unique_id: "curtailment_active", address: 41012, input_type: holding, read_function_code: 3, data_type: uint16, scan_group: slow, entity_category: diagnostic, map: {0: "No", 1: "Yes"}}
