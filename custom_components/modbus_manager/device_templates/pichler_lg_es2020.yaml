# Pichler LG ventilation units (ES2020 controller)
# Source: Pichler LIST_Modbus_ES2020_FW_LG350_LG450_LG740_LG1000_v2.1.0.xlsx.
# Addresses are protocol addresses used directly by Home Assistant/Modbus Manager
# (FC4 input registers).

name: "Pichler LG (ES2020)"
display_name: "Pichler LG (ES2020)"
description: "Shared ES2020 Modbus interface documented for Pichler LG350, LG450, LG740, and LG1000 ventilation units."
manufacturer: "Pichler"
model: "LG ES2020 (LG350/LG450/LG740/LG1000)"
type: "ventilation"
version: 1.4.0
default_prefix: "pichler_lg"
default_slave_id: 20

# Manual choice: ES2020 does not expose the installed coil configuration via
# Modbus. This is one future-independent equipment dimension, not a global
# statement of every HVAC option installed on the ventilation unit.
dynamic_config:
  # The integrated electric preheater (LG350 V variant) is independent from
  # external downstream post-heating/cooling equipment.
  preheater_type:
    description: "Integrated preheater"
    options:
      none: "No integrated preheater"
      electric: "Integrated electric preheater"
    default: none

  post_heating_cooling_type:
    description: "External post-heating/cooling equipment"
    options:
      none: "No external water coil"
      external_chilled_water_cooling_coil: "External Chilled-Water Cooling Coil"
      external_combined_heating_cooling_water_coil: "External Combined Heating/Cooling Water Coil"
    default: none

sensors:
  # Device information. The workbook maps 0=LG350, 1=LG450, 2=LG740.
  - name: "Device Model"
    unique_id: "device_model"
    translation_key: "pichler_lg_es2020_device_model"
    address: 25
    input_type: input
    data_type: uint16
    scan_interval: 3600
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:hvac"
    map:
      0: "LG350"
      1: "LG450"
      2: "LG740"

  - name: "Controller Firmware Version"
    unique_id: "controller_firmware_version"
    translation_key: "pichler_lg_es2020_controller_firmware_version"
    address: 23
    input_type: input
    data_type: uint16
    precision: 1
    scan_interval: 3600
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:chip"

  # T1-T4 are contiguous input registers. Raw u16 values use (raw - 1000) / 10.
  - name: "Outdoor Air Temperature"
    unique_id: "outdoor_air_temperature"
    translation_key: "pichler_lg_es2020_outdoor_air_temperature"
    address: 30
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 30
    mm_group: "temperatures"
    icon: "mdi:thermometer"

  - name: "Exhaust Air Temperature"
    unique_id: "exhaust_air_temperature"
    translation_key: "pichler_lg_es2020_exhaust_air_temperature"
    address: 31
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 30
    mm_group: "temperatures"
    icon: "mdi:thermometer"

  - name: "Extract Air Temperature"
    unique_id: "extract_air_temperature"
    translation_key: "pichler_lg_es2020_extract_air_temperature"
    address: 32
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 30
    mm_group: "temperatures"
    icon: "mdi:thermometer"

  - name: "Supply Air Temperature"
    unique_id: "supply_air_temperature"
    translation_key: "pichler_lg_es2020_supply_air_temperature"
    address: 33
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 30
    mm_group: "temperatures"
    icon: "mdi:thermometer"

  # T6 is downstream of Pichler's external water coil, not the internal T4.
  - name: "External Supply Air Temperature"
    unique_id: "external_supply_air_temperature"
    translation_key: "pichler_lg_es2020_external_supply_air_temperature"
    condition: "post_heating_cooling_type == 'external_chilled_water_cooling_coil' or post_heating_cooling_type == 'external_combined_heating_cooling_water_coil'"
    address: 4
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 60
    icon: "mdi:thermometer"

  # Actual flow values, not the writable holding-register setpoints at 9-12.
  - name: "Supply Airflow"
    unique_id: "supply_airflow"
    translation_key: "pichler_lg_es2020_supply_airflow"
    address: 46
    input_type: input
    data_type: uint16
    precision: 0
    unit_of_measurement: "m³/h"
    state_class: measurement
    scan_interval: 15
    mm_group: "airflow"
    icon: "mdi:weather-windy"

  - name: "Extract Airflow"
    unique_id: "extract_airflow"
    translation_key: "pichler_lg_es2020_extract_airflow"
    address: 47
    input_type: input
    data_type: uint16
    precision: 0
    unit_of_measurement: "m³/h"
    state_class: measurement
    scan_interval: 15
    mm_group: "airflow"
    icon: "mdi:weather-windy"

  - name: "Operating Status"
    unique_id: "operating_status"
    translation_key: "pichler_lg_es2020_operating_status"
    address: 48
    input_type: input
    data_type: uint16
    scan_interval: 30
    entity_category: diagnostic
    icon: "mdi:hvac"
    map:
      0: "CPU startup"
      1: "Standby"
      2: "Starting"
      3: "Operating"
      4: "Run-on"
      5: "Power-save standby"
      6: "Test mode"

  - name: "Filter Remaining Time"
    unique_id: "filter_remaining_time"
    translation_key: "pichler_lg_es2020_filter_remaining_time"
    address: 50
    input_type: input
    data_type: uint16
    precision: 0
    unit_of_measurement: "h"
    device_class: duration
    state_class: measurement
    scan_interval: 300
    entity_category: diagnostic
    icon: "mdi:air-filter"

  - name: "Preheater Temperature"
    unique_id: "preheater_temperature"
    translation_key: "pichler_lg_es2020_preheater_temperature"
    condition: "preheater_type == 'electric'"
    address: 34
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 60
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:thermometer"

  - name: "Supply Airflow Setpoint"
    unique_id: "supply_airflow_setpoint"
    translation_key: "pichler_lg_es2020_supply_airflow_setpoint"
    address: 42
    input_type: input
    data_type: uint16
    unit_of_measurement: "m³/h"
    state_class: measurement
    scan_interval: 60
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:weather-windy"

  - name: "Extract Airflow Setpoint"
    unique_id: "extract_airflow_setpoint"
    translation_key: "pichler_lg_es2020_extract_airflow_setpoint"
    address: 43
    input_type: input
    data_type: uint16
    unit_of_measurement: "m³/h"
    state_class: measurement
    scan_interval: 60
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:weather-windy"

  - name: "Current Ventilation Level"
    unique_id: "current_ventilation_level"
    translation_key: "pichler_lg_es2020_current_ventilation_level"
    address: 59
    input_type: input
    data_type: uint16
    scan_interval: 30
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:fan"
    map:
      0: "Standby"
      1: "Level 1"
      2: "Level 2"
      3: "Level 3"
      4: "Basic ventilation"
      6: "External off"
      7: "Error"

  - name: "Combined Coil Mixer Control Signal"
    unique_id: "combined_coil_mixer_control_signal"
    translation_key: "pichler_lg_es2020_combined_coil_mixer_control_signal"
    condition: "post_heating_cooling_type == 'external_combined_heating_cooling_water_coil'"
    address: 26
    input_type: input
    data_type: uint16
    scale: 0.01
    precision: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    scan_interval: 60
    entity_category: diagnostic
    icon: "mdi:valve"

  # Ao2 is the separate chilled-water cooling-coil mixer command, not valve feedback.
  - name: "Cooling Coil Mixer Control Signal"
    unique_id: "cooling_coil_mixer_control_signal"
    translation_key: "pichler_lg_es2020_cooling_coil_mixer_control_signal"
    condition: "post_heating_cooling_type == 'external_chilled_water_cooling_coil'"
    address: 12
    input_type: input
    data_type: uint16
    scale: 0.01
    precision: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    scan_interval: 60
    entity_category: diagnostic
    icon: "mdi:valve"

  # Workbook: meaningful when room or extract-air temperature control is used.
  - name: "Calculated Supply Air Temperature Setpoint"
    unique_id: "calculated_supply_air_temperature_setpoint"
    translation_key: "pichler_lg_es2020_calculated_supply_air_temperature_setpoint"
    address: 55
    input_type: input
    data_type: uint16
    scale: 0.1
    offset: -100
    precision: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 60
    entity_category: diagnostic
    enabled_by_default: false
    icon: "mdi:thermometer"

