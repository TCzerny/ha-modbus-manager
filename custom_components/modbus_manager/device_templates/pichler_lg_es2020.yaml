controls:
  # Official setpoint 002: FC3 read / FC6 write at the same holding register.
  # Pichler documents values, but not persistence/manual-mode restrictions.
  - name: "Ventilation Level"
    unique_id: "ventilation_level"
    translation_key: "pichler_lg_es2020_ventilation_level"
    type: select
    address: 2
    input_type: holding
    data_type: uint16
    scan_interval: 30
    entity_category: config
    icon: "mdi:fan"
    write_function_code: 6
    options:
      0: "Standby"
      1: "Level 1"
      2: "Level 2"
      3: "Level 3"
      4: "Basic ventilation"

  # Pichler setpoints 009-012. FC3 reads and FC6 writes the same holding word.
  # The workbook documents 0-1000 m³/h, integer resolution, and no scaling.
  # These are advanced controls; Modbus Manager currently cannot mark individual
  # template entities disabled by default, so do not operate without approval.
  - name: "Level 1 Airflow Setpoint"
    unique_id: "level_1_airflow_setpoint"
    translation_key: "pichler_lg_es2020_level_1_airflow_setpoint"
    type: number
    address: 9
    input_type: holding
    data_type: uint16
    min_value: 0
    max_value: 1000
    step: 1
    unit_of_measurement: "m³/h"
    scan_interval: 300
    entity_category: config
    icon: "mdi:fan"
    write_function_code: 6

  - name: "Level 2 Airflow Setpoint"
    unique_id: "level_2_airflow_setpoint"
    translation_key: "pichler_lg_es2020_level_2_airflow_setpoint"
    type: number
    address: 10
    input_type: holding
    data_type: uint16
    min_value: 0
    max_value: 1000
    step: 1
    unit_of_measurement: "m³/h"
    scan_interval: 300
    entity_category: config
    icon: "mdi:fan"
    write_function_code: 6

  - name: "Level 3 Airflow Setpoint"
    unique_id: "level_3_airflow_setpoint"
    translation_key: "pichler_lg_es2020_level_3_airflow_setpoint"
    type: number
    address: 11
    input_type: holding
    data_type: uint16
    min_value: 0
    max_value: 1000
    step: 1
    unit_of_measurement: "m³/h"
    scan_interval: 300
    entity_category: config
    icon: "mdi:fan"
    write_function_code: 6

  - name: "Basic Ventilation Airflow Setpoint"
    unique_id: "basic_ventilation_airflow_setpoint"
    translation_key: "pichler_lg_es2020_basic_ventilation_airflow_setpoint"
    type: number
    address: 12
    input_type: holding
    data_type: uint16
    min_value: 0
    max_value: 1000
    step: 1
    unit_of_measurement: "m³/h"
    scan_interval: 300
    entity_category: config
    icon: "mdi:fan"
    write_function_code: 6
