# Solvis SC3 Heating Control Template for Modbus Manager
# BASED ON: Official Solvis SC-3 Modbus Spezifikationen (TNF-SC-3 v1.0, Sept 2021)
# Also: https://github.com/LarsK1/hass_solvis_control supported-entities.md
# Register types per PDF: 3.3.1 Input Registers (FC 0x04), 3.3.2 Holding Registers (FC 0x03)

name: "Solvis SC3 Heating Control"
display_name: "Solvis SC3 Heating Control"
description: "Template for Solvis SC2/SC3 heating controllers. Supports temperature sensors (S1-S16), flow sensors (S17-S18), pump controls (A1-A9), and heating circuit management via Modbus TCP."
manufacturer: "Solvis"
model: "SC3"
version: 1.0.2
default_prefix: "SC3"
default_slave_id: 1
type: "heating_control"
firmware_version: "SC3"

# V1.0.2: energy/power 33536–33553, analog PWM 33294–33299, HKR3, Vorlaufart, WP bivalence;
# dynamic_config gates (hkr2/hkr3/solar/heat_pump/pv2heat/heat_meter). Heating-curve slope stays 2832/3088 (PDF).

# Dynamic configuration support
dynamic_config:
  selected_model:
    description: "Solvis device model"
    options: ["SC2", "SC3"]
    default: "SC3"

  connection_type:
    description: "Connection type"
    options: ["TCP", "RTU"]
    default: "TCP"

  hkr2_enabled:
    description: "Enable heating circuit 2 (HKR2) registers"
    options: [true, false]
    default: true

  hkr3_enabled:
    description: "Enable heating circuit 3 (HKR3) registers"
    options: [true, false]
    default: false

  solar_enabled:
    description: "Enable solar collector energy, power, PWM and S17 flow"
    options: [true, false]
    default: true

  heat_pump_enabled:
    description: "Enable heat pump energy, power and bivalence registers"
    options: [true, false]
    default: false

  pv2heat_enabled:
    description: "Enable PV2Heat energy and power registers (not gas power)"
    options: [true, false]
    default: false

  heat_meter_enabled:
    description: "Enable external heat-meter power register 33550"
    options: [true, false]
    default: false

# Sensors (Input Registers - Read Only)
sensors:
  # Device Information
  - name: "Anzahl Heizkreise"
    unique_id: "anzahl_heizkreise"
    address: 2
    precision: 0
    input_type: "input"
    data_type: "uint16"
    scan_interval: 600
    mm_group: "diagnose"
    icon: "mdi:information"
    # Min: 1, Max: 3

  - name: "Version SC3 Raw"
    unique_id: "version_sc3_raw"
    address: 32770
    input_type: "input"
    data_type: "uint16"
    scan_interval: 600
    mm_group: "diagnose"
    icon: "mdi:chip"
    entity_category: "diagnostic"

  - name: "Version NBG Raw"
    unique_id: "version_nbg_raw"
    address: 32771
    input_type: "input"
    data_type: "uint16"
    scan_interval: 600
    mm_group: "diagnose"
    icon: "mdi:chip"
    entity_category: "diagnostic"

  # Diagnostic Sensors
  - name: "Meldungen Anzahl"
    unique_id: "meldungen_anzahl"
    address: 33792
    precision: 0
    input_type: "input"
    data_type: "uint16"
    scan_interval: 60
    mm_group: "diagnose"
    icon: "mdi:message-alert"

  # Analog Output Status (Diagnostic)
  # Note: These show the modulation mode for various outputs
  # Analog Out 1 is typically used for burner modulation
  - name: "Brennermodulation Modus"
    unique_id: "brennermodulation_modus"
    address: 3840
    input_type: "input"
    data_type: "uint16"
    scan_interval: 60
    mm_group: "diagnose"
    icon: "mdi:gauge"
    options:
      0: "Auto PWM"
      1: "Hand PWM"
      2: "Auto analog"
      3: "Hand analog"

  - name: "Wärmepumpe Ladepumpe Modus"
    unique_id: "warmepumpe_ladepumpe_modus"
    condition: "heat_pump_enabled == true"
    address: 3845
    input_type: "input"
    data_type: "uint16"
    scan_interval: 60
    mm_group: "diagnose"
    icon: "mdi:pump"
    options:
      0: "Auto PWM"
      1: "Hand PWM"
      2: "Auto analog"
      3: "Hand analog"

  - name: "Analog Out 3 Status"
    unique_id: "analog_out_3_status"
    address: 3850
    input_type: "input"
    data_type: "uint16"
    scan_interval: 60
    mm_group: "diagnose"
    icon: "mdi:gauge"
    options:
      0: "Auto PWM"
      1: "Hand PWM"
      2: "Auto analog"
      3: "Hand analog"

  - name: "Analog Out 4 Status"
