# Calculated Sensors
calculated:
  - name: "Version SC3"
    unique_id: "version_sc3"
    mm_group: "diagnose"
    icon: "mdi:chip"
    entity_category: "diagnostic"
    template: |
      {% set v = states('[[mm:sensor:{PREFIX}_version_sc3_raw]]') | int(0) %}
      {% if v > 0 %}
        {{ '%d.%02d.%02d' | format(v // 10000, (v // 100) % 100, v % 100) }}
      {% else %}
        unknown
      {% endif %}
    # Format: raw 32016 -> 3.20.16 (Firmware version in device info)

  - name: "Version NBG"
    unique_id: "version_nbg"
    mm_group: "diagnose"
    icon: "mdi:chip"
    entity_category: "diagnostic"
    template: |
      {% set v = states('[[mm:sensor:{PREFIX}_version_nbg_raw]]') | int(0) %}
      {% if v > 0 %}
        {{ '%d.%02d.%02d' | format(v // 10000, (v // 100) % 100, v % 100) }}
      {% else %}
        unknown
      {% endif %}
    # Format: raw 30000 -> 3.00.00 (Hardware version in device info)

  - name: "Solarthermie Leistung"
    unique_id: "solarthermie_leistung"
    condition: "solar_enabled == true"
    mm_group: "heating_calculated"
    icon: "mdi:solar-power"
    unit_of_measurement: "kW"
    precision: 1
    device_class: "power"
    state_class: "measurement"
    template: |
      {% set collector_temp = states('[[mm:sensor:{PREFIX}_temperatur_s8]]') | float(0) %}
      {% set circuit_temp = states('[[mm:sensor:{PREFIX}_temperatur_s3]]') | float(0) %}
      {% set flow = states('[[mm:sensor:{PREFIX}_durchflussmenge_s17]]') | float(0) %}
      {% if collector_temp > circuit_temp and flow > 0 %}
        {{ ((collector_temp - circuit_temp) * flow * 0.07) | round(2) }}
      {% else %}
        0
      {% endif %}
    # Calculated: (T_collector - T_circuit) * flow * 0.07 (specific heat capacity of water)
    # NOTE: Assumes S8 = collector temp, S3 = circuit temp. Adjust if your installation differs.

  - name: "Solarkollektor Delta T"
    unique_id: "solarkollektor_delta_t"
    condition: "solar_enabled == true"
    mm_group: "heating_calculated"
    icon: "mdi:thermometer-lines"
    unit_of_measurement: "°C"
    precision: 1
    device_class: "temperature"
    state_class: "measurement"
    template: |
      {% set collector_temp = states('[[mm:sensor:{PREFIX}_temperatur_s8]]') | float(0) %}
      {% set circuit_temp = states('[[mm:sensor:{PREFIX}_temperatur_s3]]') | float(0) %}
      {% if collector_temp > 0 and circuit_temp > 0 %}
        {{ (collector_temp - circuit_temp) | round(1) }}
      {% else %}
        0
      {% endif %}
    # Temperature difference between collector and circuit
    # NOTE: Assumes S8 = collector temp, S3 = circuit temp. Adjust if your installation differs.

  - name: "Heizkreis 1 Delta T"
    unique_id: "heizkreis_1_delta_t"
    mm_group: "heating_calculated"
    icon: "mdi:thermometer-lines"
    unit_of_measurement: "°C"
    precision: 1
    device_class: "temperature"
    state_class: "measurement"
    template: |
      {% set flow_temp = states('[[mm:sensor:{PREFIX}_temperatur_s1]]') | float(0) %}
      {% set return_temp = states('[[mm:sensor:{PREFIX}_temperatur_s2]]') | float(0) %}
      {% if flow_temp > 0 and return_temp > 0 %}
        {{ (flow_temp - return_temp) | round(1) }}
      {% else %}
        0
      {% endif %}
    # Temperature difference between flow and return (HK1)
    # NOTE: Assumes S1 = flow temp, S2 = return temp for heating circuit 1.
    # This is a common configuration but may differ per installation.

  - name: "Heizkreis 2 Delta T"
    unique_id: "heizkreis_2_delta_t"
    condition: "hkr2_enabled == true"
    mm_group: "heating_calculated"
    icon: "mdi:thermometer-lines"
    unit_of_measurement: "°C"
    precision: 1
    device_class: "temperature"
    state_class: "measurement"
    template: |
      {% set flow_temp = states('[[mm:sensor:{PREFIX}_temperatur_s9]]') | float(0) %}
      {% set return_temp = states('[[mm:sensor:{PREFIX}_temperatur_s10]]') | float(0) %}
      {% if flow_temp > 0 and return_temp > 0 %}
        {{ (flow_temp - return_temp) | round(1) }}
      {% else %}
        0
      {% endif %}
    # Temperature difference between flow and return (HK2)
    # NOTE: Assumes S9 = flow temp, S10 = return temp for heating circuit 2.
    # This is a common configuration but may differ per installation.

  - name: "Heizkreis 1 Leistung"
    unique_id: "heizkreis_1_leistung"
    mm_group: "heating_calculated"
    icon: "mdi:radiator"
    unit_of_measurement: "kW"
    precision: 1
    device_class: "power"
    state_class: "measurement"
    template: |
      {% set delta_t = states('[[mm:sensor:{PREFIX}_heizkreis_1_delta_t]]') | float(0) %}
      {% set flow = states('[[mm:sensor:{PREFIX}_durchflussmenge_s18]]') | float(0) %}
      {% if delta_t > 0 and flow > 0 %}
        {{ (delta_t * flow * 0.07) | round(2) }}
      {% else %}
        0
      {% endif %}
    # Calculated: Delta T * flow * 0.07 (specific heat capacity of water)

  - name: "Heizkreis 2 Leistung"
    unique_id: "heizkreis_2_leistung"
    condition: "hkr2_enabled == true"
    mm_group: "heating_calculated"
    icon: "mdi:radiator"
    unit_of_measurement: "kW"
    precision: 1
    device_class: "power"
    state_class: "measurement"
    template: |
      {% set delta_t = states('[[mm:sensor:{PREFIX}_heizkreis_2_delta_t]]') | float(0) %}
      {% set flow = states('[[mm:sensor:{PREFIX}_durchflussmenge_s18]]') | float(0) %}
      {% if delta_t > 0 and flow > 0 %}
        {{ (delta_t * flow * 0.07) | round(2) }}
      {% else %}
        0
      {% endif %}
    # Calculated: Delta T * flow * 0.07 (specific heat capacity of water)

  - name: "Solar Effizienz"
    unique_id: "solar_effizienz"
    condition: "solar_enabled == true"
    mm_group: "heating_calculated"
    icon: "mdi:gauge"
    unit_of_measurement: "%"
    precision: 1
    device_class: None
    state_class: "measurement"
    template: |
      {% set collector_temp = states('[[mm:sensor:{PREFIX}_temperatur_s8]]') | float(0) %}
      {% set outside_temp = states('[[mm:sensor:{PREFIX}_temperatur_s15]]') | float(0) %}
      {% set flow = states('[[mm:sensor:{PREFIX}_durchflussmenge_s17]]') | float(0) %}
      {% if collector_temp > outside_temp and flow > 0 and outside_temp > -50 %}
        {% set delta_t = collector_temp - outside_temp %}
        {% set max_delta = 50 %}
        {{ ((delta_t / max_delta) * 100) | round(1) }}
      {% else %}
        0
      {% endif %}
    # Efficiency based on temperature difference (simplified calculation)
    # NOTE: Assumes S8 = collector temp, S15 = outside temp. Adjust if your installation differs.

# Binary Sensors
