  # Digital Input Faults
  - name: "DigIn Fehler"
    unique_id: "digin_fehler"
    address: 33045
    input_type: "input"
    data_type: "uint16"
    scan_interval: 30
    mm_group: "diagnose"
    icon: "mdi:alert"
    device_class: "problem"
