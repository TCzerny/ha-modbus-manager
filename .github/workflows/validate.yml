# HACS default catalog requires hassfest and hacs/action to pass with no ignores.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch hassfest / HACS action drift against current Home Assistant.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
